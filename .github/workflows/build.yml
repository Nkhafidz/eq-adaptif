name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Runner ubuntu sudah membawa Android SDK; cukup terima lisensinya
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk EQ-Adaptif.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EQ-Adaptif-apk
          path: EQ-Adaptif.apk

      # Rilis di halaman Releases supaya APK mudah diunduh langsung dari HP
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: EQ Adaptif v1.0.${{ github.run_number }}
          body: "Unduh **EQ-Adaptif.apk** di bawah lalu pasang di HP Android (Android 9 ke atas)."
          files: EQ-Adaptif.apk
          make_latest: true
